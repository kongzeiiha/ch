services:
  postgres:
    # Reusing 15-alpine (already cached locally from the Dify stack) to avoid
    # re-pulling on a stacked overlay2 that hits ELOOP. gen_random_uuid() is
    # core since PG13, so our schema works unchanged.
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ch
      POSTGRES_PASSWORD: ch
      POSTGRES_DB: ch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:6-alpine
    # Host 6380 because MacPorts redis already holds 127.0.0.1:6379.
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  minio-data:
