services:
  postgres:
    # Reusing 15-alpine (already cached locally from the Dify stack) to avoid
    # re-pulling on a stacked overlay2 that hits ELOOP. gen_random_uuid() is
    # core since PG13, so our schema works unchanged.
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ch
      POSTGRES_PASSWORD: ch
      POSTGRES_DB: ch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ────────────────────────────────────────────────
  # These three services are optional in development (the default "pnpm dev"
  # workflow runs everything natively). Use them for a self-contained stack:
  #   docker compose --profile app up
  #
  # Both api services share the same image; the worker entry point is
  # overridden via CMD. Copy .env.example → .env and fill in secrets before
  # starting.

  api-server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/index.js"]
    env_file: .env
    environment:
      DISABLE_WORKERS: "1"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api-server
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
